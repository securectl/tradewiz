<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Analyst — Authenticator Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722; color: #d1d4dc;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .card {
            background: #1e222d; border: 1px solid #363a45; border-radius: 12px;
            padding: 48px 40px; max-width: 400px; width: 100%; text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .title { font-size: 20px; font-weight: 600; color: #e0e3eb; margin-bottom: 8px; }
        .desc { color: #787b86; font-size: 14px; margin-bottom: 28px; }
        .code-input {
            background: #2a2e39; border: 1px solid #363a45; border-radius: 8px;
            padding: 14px; color: #e0e3eb; font-size: 24px; font-weight: 600;
            text-align: center; letter-spacing: 8px; width: 100%;
        }
        .code-input:focus { outline: none; border-color: #ef5350; }
        .btn-primary {
            background: #ef5350; color: white; border: none; border-radius: 8px;
            padding: 12px 32px; font-size: 15px; font-weight: 500; cursor: pointer;
            width: 100%; margin-top: 16px; transition: background 0.2s;
        }
        .btn-primary:hover { background: #d32f2f; }
        .error-msg {
            background: rgba(239, 83, 80, 0.1); border: 1px solid #ef5350;
            color: #ef5350; border-radius: 6px; padding: 10px; font-size: 13px; margin-bottom: 16px;
        }
        .back-link { margin-top: 20px; font-size: 12px; }
        .back-link a { color: #787b86; text-decoration: none; }
        .back-link a:hover { color: #d1d4dc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#128272;</div>
        <div class="title">Two-Factor Authentication</div>
        <div class="desc">Enter the 6-digit code from your authenticator app</div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/totp-verify">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}"
                   placeholder="000000" required autofocus autocomplete="one-time-code">
            <button type="submit" class="btn-primary">Verify</button>
        </form>

        <div class="back-link"><a href="/auth/admin-login">&larr; Back to admin login</a></div>
        <div style="margin-top:20px;font-size:10px;color:#555;line-height:1.5;">&copy; 2025 Infinity Ventures Group LLC. All rights reserved.</div>
    </div>
</body>
</html>
