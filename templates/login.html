<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Analyst — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722;
            color: #d1d4dc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #1e222d;
            border: 1px solid #363a45;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e0e3eb;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #787b86;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .google-btn:hover { background: #3367d6; }
        .google-btn svg { width: 20px; height: 20px; }
        .divider {
            margin: 24px 0;
            border-top: 1px solid #363a45;
        }
        .dev-form input {
            background: #2a2e39;
            border: 1px solid #363a45;
            border-radius: 6px;
            padding: 10px 14px;
            color: #d1d4dc;
            font-size: 14px;
            width: 100%;
            margin-bottom: 12px;
        }
        .dev-btn {
            background: #363a45;
            color: #d1d4dc;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .dev-btn:hover { background: #464a56; }
        .dev-label {
            color: #787b86;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .info {
            margin-top: 24px;
            color: #787b86;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">AI Stock Analyst</div>
        <div class="subtitle">Breakout Pattern Scanner & Trading Platform</div>

        {% if not dev_mode %}
        <a href="/auth/google" class="google-btn">
            <svg viewBox="0 0 24 24" fill="white">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </a>
        {% endif %}

        {% if dev_mode %}
        <div class="dev-label">Development Mode — Google OAuth not configured</div>
        <form class="dev-form" method="POST" action="/auth/dev-login">
            <input type="email" name="email" placeholder="Email" value="dev@localhost" required>
            <input type="text" name="name" placeholder="Display Name" value="Developer">
            <button type="submit" class="dev-btn">Sign in (Dev Mode)</button>
        </form>
        {% endif %}

        <div class="info">
            Invite-only platform. Contact admin for access.
        </div>
    </div>
</body>
</html>
