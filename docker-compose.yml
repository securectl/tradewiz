services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: stockbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-changeme}@db:5432/stockbot
    depends_on:
      db:
        condition: service_healthy
    # --preload removed Apr 2026 — master importing the app pre-fork was the
    # source of the "listening but no worker" zombie state. With workers=1,
    # --preload's memory-sharing benefit is nil. Each worker now imports
    # independently post-fork; if a worker hangs during import, gunicorn
    # kills it after `timeout` and respawns rather than the entire container
    # being stuck.
    command: >
      sh -c "python migrations.py && gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 8 --timeout 300 app:app"
    healthcheck:
      # Auto-recovers from the preload-zombie state (gunicorn listening but
      # never forking workers). Docker doesn't auto-restart unhealthy
      # containers natively — so the failing branch sends SIGTERM to PID 1
      # (gunicorn master) which exits the container, then `restart: unless-stopped`
      # picks up and starts a fresh container. Verified Apr 2026.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=3)\" || kill -TERM 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
